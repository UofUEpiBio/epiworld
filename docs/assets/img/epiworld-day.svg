<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img"
     aria-label="How an epiworld 1.0 model runs: at the start of each run the agents are reset, the layers drawn, the viruses, tools and initial stages placed and the global events set up; then, every day, each agent proposes an infection, a stage change in each disease and a status change, in that order and from its state at the start of the day; the proposals are applied together, reactions fire, global events run, tomorrow's parameters and layer schedules apply, the layers are updated and the day recorded, viruses may mutate, and the next day starts."
     font-family="Source Sans Pro, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1f2937">
  <title>How an epiworld 1.0 model runs, day by day</title>
  <!-- Read from epiworld v1-layers (Phase 4): Model::run(), Model::reset(),
       Model::update_state(), Model::nh_step(), events_run() (reactions),
       Model::next() (apply_param_cycles(), update_layers(),
       ContactLayer::apply_closure()). -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00707a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>

  <!-- Start of each run -->
  <rect x="20" y="20" width="230" height="460" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="135" y="48" text-anchor="middle" font-size="16" font-weight="700">Start of each run</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="62" width="190" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="135" y="83" font-size="14" font-weight="600">Agents reset</text>
    <text x="135" y="101" fill="#4b5563">first stage; cycles at day 1</text>

    <rect x="40" y="130" width="190" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="135" y="151" font-size="14" font-weight="600">Layers drawn</text>
    <text x="135" y="169" fill="#4b5563">networks, groups, participation</text>

    <rect x="40" y="198" width="190" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="135" y="219" font-size="14" font-weight="600">Viruses placed</text>
    <text x="135" y="237" fill="#4b5563" font-family="Menlo, Consolas, monospace">assign::</text>

    <rect x="40" y="266" width="190" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="135" y="287" font-size="14" font-weight="600">Tools placed</text>
    <text x="135" y="305" fill="#4b5563" font-family="Menlo, Consolas, monospace">assign::</text>

    <rect x="40" y="334" width="190" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="135" y="355" font-size="14" font-weight="600">Initial stages set</text>
    <text x="135" y="373" fill="#4b5563" font-family="Menlo, Consolas, monospace">assign::</text>

    <rect x="40" y="402" width="190" height="50" rx="6" fill="#ffffff" stroke="#9ca3af"/>
    <text x="135" y="423" font-size="14" font-weight="600">Global events set up</text>
    <text x="135" y="441" fill="#4b5563">in force from day 1</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="135" y1="112" x2="135" y2="128"/>
    <line x1="135" y1="180" x2="135" y2="196"/>
    <line x1="135" y1="248" x2="135" y2="264"/>
    <line x1="135" y1="316" x2="135" y2="332"/>
    <line x1="135" y1="384" x2="135" y2="400"/>
  </g>

  <!-- Every day -->
  <rect x="290" y="20" width="890" height="460" rx="10" fill="#fbfefe" stroke="#00707a" stroke-width="1.5"/>
  <text x="312" y="48" font-size="16" font-weight="700" fill="#00707a">Every day</text>
  <text x="400" y="48" font-size="13" fill="#4b5563">each agent proposes, in this order, from its state at the start of the day</text>

  <!-- Into the first day (drawn over the frame) -->
  <path d="M230,427 L270,427 L270,155 L313,155" fill="none" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="262" y="300" font-size="12" fill="#4b5563" text-anchor="middle" transform="rotate(-90 262 300)">day 0 recorded, then day 1</text>

  <!-- Row A: what each agent proposes -->
  <g font-size="13" text-anchor="middle">
    <rect x="315" y="66" width="260" height="122" rx="8" fill="#f8d7da" stroke="#b02a37" stroke-width="1.5"/>
    <text x="445" y="92" font-size="15" font-weight="700">1 · Infection</text>
    <text x="445" y="116">agents without a virus pull</text>
    <text x="445" y="134">contacts from every layer;</text>
    <text x="445" y="152">one draw: no one, or</text>
    <text x="445" y="170">one infector</text>

    <rect x="605" y="66" width="260" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="735" y="92" font-size="15" font-weight="700">2 · Stage, in each disease</text>
    <text x="735" y="116">its rates compete: one draw</text>
    <text x="735" y="134">picks one, or none;</text>
    <text x="735" y="152">else an <tspan font-family="Menlo, Consolas, monospace" font-size="12">after()</tspan> whose</text>
    <text x="735" y="170">duration has ended</text>

    <rect x="895" y="66" width="260" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="1025" y="92" font-size="15" font-weight="700">3 · Status</text>
    <text x="1025" y="116">its rates compete (some only</text>
    <text x="1025" y="134">in some stages: <tspan font-family="Menlo, Consolas, monospace" font-size="12">when()</tspan>);</text>
    <text x="1025" y="152">else an <tspan font-family="Menlo, Consolas, monospace" font-size="12">after()</tspan> whose</text>
    <text x="1025" y="170">duration has ended</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="575" y1="127" x2="603" y2="127"/>
    <line x1="865" y1="127" x2="893" y2="127"/>
  </g>

  <!-- Down: proposals are queued -->
  <line x1="1025" y1="188" x2="1025" y2="264" stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="1035" y="224" font-size="12" fill="#4b5563">every agent done:</text>
  <text x="1035" y="240" font-size="12" fill="#4b5563">proposals queued</text>

  <!-- Row B: the whole model, right to left -->
  <g font-size="13" text-anchor="middle">
    <rect x="895" y="266" width="260" height="122" rx="8" fill="#e0f0f1" stroke="#00707a" stroke-width="2"/>
    <text x="1025" y="292" font-size="15" font-weight="700" fill="#00707a">Proposals applied together</text>
    <text x="1025" y="316">entry day recorded;</text>
    <text x="1025" y="334">the stage's duration drawn;</text>
    <text x="1025" y="352"><tspan font-weight="700">reactions</tspan> fire</text>
    <text x="1025" y="370">(<tspan font-family="Menlo, Consolas, monospace" font-size="12">react()</tspan>, the same day)</text>

    <rect x="665" y="266" width="200" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="765" y="292" font-size="15" font-weight="700">Global events</text>
    <text x="765" y="316">model-wide code,</text>
    <text x="765" y="334">e.g. the quarantine</text>
    <text x="765" y="352">process: tracing,</text>
    <text x="765" y="370"><tspan font-family="Menlo, Consolas, monospace" font-size="12">fire()</tspan></text>

    <rect x="435" y="266" width="200" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="535" y="292" font-size="15" font-weight="700">Layers updated</text>
    <text x="535" y="316">tomorrow's parameters</text>
    <text x="535" y="334">(cycles); schedules open</text>
    <text x="535" y="352">or close layers; rewiring;</text>
    <text x="535" y="370">the day is recorded</text>

    <rect x="315" y="266" width="90" height="122" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="360" y="316" font-size="15" font-weight="700">Viruses</text>
    <text x="360" y="336" font-size="15" font-weight="700">mutate</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" marker-end="url(#ah)">
    <line x1="895" y1="327" x2="867" y2="327"/>
    <line x1="665" y1="327" x2="637" y2="327"/>
    <line x1="435" y1="327" x2="407" y2="327"/>
  </g>

  <!-- Next day -->
  <line x1="360" y1="266" x2="360" y2="190" stroke="#00707a" stroke-width="2" marker-end="url(#aht)"/>
  <text x="370" y="232" font-size="13" font-weight="700" fill="#00707a">next day</text>

  <!-- The mechanism in one line -->
  <text x="735" y="430" font-size="14" text-anchor="middle" font-style="italic" fill="#4b5563">Nothing changes before every agent has decided: all of them see the same start-of-day state,</text>
  <text x="735" y="450" font-size="14" text-anchor="middle" font-style="italic" fill="#4b5563">so no agent reacts to a change made earlier the same day.</text>
</svg>
