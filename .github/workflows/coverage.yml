name: Code coverage

on: [pull_request]

# A new push to the same PR supersedes the coverage run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # clang-18 and llvm-18 (llvm-profdata, llvm-cov) ship with the runner image.
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y libxml-libxml-perl cpanminus

      - name: Cache cpanm
        uses: actions/cache@v5
        with:
          path: ~/.cpanm
          key: "${{ runner.os }}-llvm18-cpanm-${{ hashFiles('cpanfile') }}"

      - name: Install Perl modules
        run: cpanm --notest --installdeps .

      # Clang source-based coverage; WITH_COVERAGE=1 also turns OpenMP off.
      - name: Generate coverage
        run: |
          make test -j"$(nproc)" VERBOSE=1 WITH_COVERAGE=1 \
            CC=clang-18 CXX=clang++-18 \
            LLVM_PROFDATA=llvm-profdata-18 LLVM_COV=llvm-cov-18

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./build/tests/.coverage/coverage.info
          flags: unittests
          name: codecov-upload
          fail_ci_if_error: true
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}
