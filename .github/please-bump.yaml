version: 1
defaults:
  # Releases are published per component: epiworld-v0.17.1, measles-v0.4.0.
  tag-pattern: "{group}-v{version}"
groups:
  epiworld:
    paths:
      - include/epiworld/
      - epiworld.hpp
    preset: cpp-semantic
    files:
      - epiworld.hpp
      - include/epiworld/epiworld.hpp
  measles:
    paths:
      - include/measles/
    preset: cpp-semantic
    files:
      - include/measles/measles.hpp
